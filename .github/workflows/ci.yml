name: CI

# Note on directory layout (CI vs. local):
# `shopware/github-actions/setup-extension@main` hardcodes the extension checkout
# to `custom/plugins/{name}/`. Although this project is a Symfony bundle (not a
# Shopware plugin) and lives at `custom/bundles/SwagMcpDevTools/` in the monorepo,
# in CI it's symlinked into `custom/plugins/` to satisfy the action. Bundle
# registration is done via class name in `config/bundles.php`, so the filesystem
# path is irrelevant at runtime — the bundle still loads the same either way.
#
# If the setup-extension action ever grows a `path:` input, we can switch back to
# `custom/bundles/` here to match local layout.

on:
  push:
    branches: [main]
  pull_request:

env:
  COMPOSER_ALLOW_SUPERUSER: 1
  COMPOSER_PLUGIN_LOADER: 1
  PHP_VERSION: "8.4"
  SHOPWARE_VERSION: poc/mcp-bundle
  # See header comment: CI uses custom/plugins/ because setup-extension hardcodes it.
  EXTRA_REPOSITORIES: |
    {
      "${{ github.event.repository.name }}": {
        "type": "path",
        "url": "custom/plugins/${{ github.event.repository.name }}",
        "symlink": true
      }
    }
  EXPECTED_MCP_CAPABILITIES: |
    swag-dev-tools-log-stream
    swag-dev-tools-log-search
    swag-dev-tools-notifications

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: false
          phpVersion: ${{ env.PHP_VERSION }}
          shopwareVersion: ${{ env.SHOPWARE_VERSION }}
          extraRepositories: ${{ env.EXTRA_REPOSITORIES }}

      - name: Register bundle
        run: |
          sed -i '/^return \$bundles;/i $bundles[Swag\\McpDevTools\\SwagMcpDevToolsBundle::class] = ["all" => true];' config/bundles.php
          symfony console cache:clear

      - name: PHPStan
        run: symfony composer -d custom/plugins/${{ github.event.repository.name }} run phpstan

  codestyle:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/cs-fixer@main
        with:
          rules: ""

  phpunit:
    name: PHPUnit (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: false
          phpVersion: ${{ env.PHP_VERSION }}
          shopwareVersion: ${{ env.SHOPWARE_VERSION }}
          extraRepositories: ${{ env.EXTRA_REPOSITORIES }}

      - name: Register bundle
        run: |
          sed -i '/^return \$bundles;/i $bundles[Swag\\McpDevTools\\SwagMcpDevToolsBundle::class] = ["all" => true];' config/bundles.php
          symfony console cache:clear

      - name: PHPUnit (unit)
        run: symfony composer -d custom/plugins/${{ github.event.repository.name }} run test -- --testsuite unit

  mcp-registration:
    name: MCP Tool Registration
    runs-on: ubuntu-latest
    env:
      MCP_SERVER: 1
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: false
          phpVersion: ${{ env.PHP_VERSION }}
          shopwareVersion: ${{ env.SHOPWARE_VERSION }}
          extraRepositories: ${{ env.EXTRA_REPOSITORIES }}

      - name: Register bundle
        run: |
          sed -i '/^return \$bundles;/i $bundles[Swag\\McpDevTools\\SwagMcpDevToolsBundle::class] = ["all" => true];' config/bundles.php
          symfony console cache:clear

      - name: Assert dev MCP tools are registered
        run: |
          set -euo pipefail
          output=$(symfony console debug:mcp)
          echo "$output"
          missing=()
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            grep -Fq "$name" <<< "$output" || missing+=("$name")
          done <<< "$EXPECTED_MCP_CAPABILITIES"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing MCP capabilities: ${missing[*]}"
            exit 1
          fi
